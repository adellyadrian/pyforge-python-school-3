name: Run tests workflow

on:
  push:
    branches:
      - main  
      - develop
      - feature/*

  pull_request:
    branches:
      - main
      - develop
      - feature/*


jobs:
  lint:
    name: Run flake8
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install flake8
        run: |
          pip install flake8

      - name: Run flake8
        run: |
          flake8 .
      
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

  test:
    name: Run tests with pytest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Start Docker containers
        run: docker-compose up -d

      - name: Install Python dependencies
        run: docker-compose exec -T web1 pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker-compose exec -T db pg_isready -U user; then
              break
            fi
            sleep 1
          done
        shell: bash
      
      - name: Run Alembic migrations
        run: docker-compose exec -T web1 alembic upgrade head
        
      - name: Run tests with pytest
        run: |
          set -e
          docker-compose exec -T web1 pytest tests/test.py -vv
        
      - name: Shutdown Docker containers
        if: always()
        run: docker-compose down
